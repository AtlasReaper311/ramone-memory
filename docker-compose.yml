# ramone-memory
#
# One command to a working memory layer:  docker compose up --build -d
#
# The FastAPI proxy connects to a separately managed private Qdrant service.
# Ollama stays on the host (it owns the GPU); the container reaches it
# through host.docker.internal, which extra_hosts maps on native Linux.

name: ramone-memory

services:
  memory:
    build: .
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      # ${VAR:-default} reads .env if present and falls back to the same
      # defaults baked into app/config.py, so the stack boots with no
      # .env file at all.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - CHAT_MODEL=${CHAT_MODEL:-llama3.1:8b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - COLLECTION_NAME=${COLLECTION_NAME:-ramone_memory}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-https://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_CA_CERT=${QDRANT_CA_CERT:-}
      - QDRANT_VERIFY_TLS=${QDRANT_VERIFY_TLS:-true}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-768}
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-20}
      - TOP_K=${TOP_K:-3}
      - MAX_INJECTED_CHARS=${MAX_INJECTED_CHARS:-2400}
      - SESSION_IDLE_SECONDS=${SESSION_IDLE_SECONDS:-300}
      - REAPER_INTERVAL_SECONDS=${REAPER_INTERVAL_SECONDS:-30}
      - RAW_TURNS_KEPT=${RAW_TURNS_KEPT:-8}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT:-}
      - NUM_CTX=${NUM_CTX:-4096}
      - TEMPERATURE=${TEMPERATURE:-0.2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      # Docker Desktop provides host.docker.internal natively; native
      # Linux does not. host-gateway makes the name resolve everywhere,
      # which is what keeps OLLAMA_HOST's default cross-platform.
      - "host.docker.internal:host-gateway"
